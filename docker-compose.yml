services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: shamai
      POSTGRES_PASSWORD: shamai
      POSTGRES_DB: shamai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shamai -d shamai"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://shamai:shamai@db:5432/shamai
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["uv", "run", "python", "-m", "app.jobs.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://shamai:shamai@db:5432/shamai
    depends_on:
      db:
        condition: service_healthy
