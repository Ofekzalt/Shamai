name: CI

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run lint-imports

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: shamai
          POSTGRES_PASSWORD: shamai
          POSTGRES_DB: shamai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shamai -d shamai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://shamai:shamai@localhost:5432/shamai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run alembic upgrade head
      - run: uv run pytest tests/unit tests/integration tests/reliability tests/trajectory -q
